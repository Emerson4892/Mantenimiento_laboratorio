services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: "no"

    ports:
      - "5678:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      - postgres


  postgres:
    image: postgres:17
    container_name: postgres
    restart: "no"

    env_file:
      - ./secrets/postgres.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"


volumes:

  n8n_data:
    external: true

  postgres_data:
